[project]
name = "github-repo-analyzer"
version = "1.0.0"
description = "Analyze public GitHub repositories: commits, languages, contributors and historical trends."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.165,<1",
    "uvicorn[standard]>=0.54,<1",
    "httpx>=0.29,<1",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.32,<1",
    "alembic>=1.20,<2",
    "pandas>=3.1,<4",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.5,<2",
    "pytest-cov>=7.1,<8",
    "respx>=0.23,<1",
    "aiosqlite>=0.22,<1",
    "ruff>=0.17,<1",
    "mypy>=2.4,<3",
    "pandas-stubs>=3.1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["app/__main__.py"]
concurrency = ["greenlet", "thread"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "PL", "PT", "N", "C4", "DTZ"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["respx.*"]
ignore_missing_imports = true
